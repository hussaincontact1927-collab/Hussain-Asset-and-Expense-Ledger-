<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>আমার ব্যক্তিগত হিসাব খাতা</title>

<style>
*{box-sizing:border-box}

:root{
--green:#087f5b;
--red:#d71920;
--gold:#b88918;
--blue:#3976c7;
--bg:#f3f6f5;
--card:#fff;
--text:#17201d;
--muted:#6d7773;
--border:#dbe4e1;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,"Noto Sans Bengali",sans-serif;
padding-bottom:80px;
}

body.dark{
--bg:#101513;
--card:#19201d;
--text:#f1f5f3;
--muted:#a9b4af;
--border:#35423e;
}

button,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
}

header{
color:#fff;
padding:16px;
border-radius:0 0 28px 28px;
background:linear-gradient(120deg,#087f5b 0 58%,#d71920 58%);
background-position:center;
background-size:cover;
}

.top{
display:flex;
align-items:center;
gap:10px;
}

.menu{
width:44px;
height:44px;
border:0;
border-radius:13px;
background:#ffffff25;
color:white;
font-size:25px;
}

h1{
font-size:20px;
margin:0;
}

.clock{
font-size:27px;
font-weight:bold;
margin-top:14px;
}

.dates{
font-size:12px;
line-height:1.7;
margin-top:4px;
}

.prayer-pills{
display:flex;
gap:6px;
overflow:auto;
margin-top:10px;
}

.pill{
white-space:nowrap;
padding:6px 9px;
border:1px solid #ffffff35;
border-radius:12px;
background:#ffffff20;
font-size:11px;
}

main{
max-width:950px;
margin:auto;
padding:13px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:14px;
margin-bottom:12px;
box-shadow:0 2px 10px #00000008;
}

.full{
grid-column:1/-1;
}

.stat b{
display:block;
font-size:21px;
margin-top:5px;
}

.green{color:var(--green)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.gold{color:var(--gold)}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:8px 0 4px;
}

input,select,textarea{
width:100%;
padding:10px;
border:1px solid var(--border);
border-radius:12px;
background:var(--card);
color:var(--text);
}

textarea{
min-height:100px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:10px;
}

.btn{
border:0;
border-radius:12px;
padding:10px 13px;
background:#e8f1ee;
color:var(--green);
font-weight:bold;
}

.primary{
background:var(--green);
color:white;
}

.danger{
background:#fde8e9;
color:#c71928;
}

.list{
display:grid;
gap:8px;
margin-top:10px;
}

.item{
border:1px solid var(--border);
border-radius:14px;
padding:10px;
display:flex;
justify-content:space-between;
gap:8px;
align-items:center;
}

.muted{
color:var(--muted);
font-size:12px;
}

/* BOTTOM ICON BAR */

.bottom{
position:fixed;
z-index:50;
bottom:7px;
left:7px;
right:7px;
background:#fffffff2;
border:1px solid var(--border);
border-radius:22px;
padding:5px;
display:flex;
justify-content:space-around;
box-shadow:0 6px 25px #0002;
backdrop-filter:blur(10px);
}

body.dark .bottom{
background:#19201df2;
}

.nav{
border:0;
background:transparent;
color:var(--muted);
font-size:9px;
min-width:45px;
padding:4px;
border-radius:13px;
}

.nav span{
display:block;
font-size:19px;
}

.nav.active{
background:var(--green);
color:white;
}

/* DRAWER */

.drawer{
position:fixed;
z-index:100;
top:0;
bottom:0;
left:-330px;
width:310px;
max-width:88%;
background:var(--card);
padding:16px;
overflow:auto;
transition:.25s;
box-shadow:8px 0 30px #0003;
}

.drawer.open{
left:0;
}

.shade{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:90;
}

.shade.show{
display:block;
}

.mi{
display:flex;
align-items:center;
gap:10px;
width:100%;
border:0;
text-align:left;
padding:12px;
margin:6px 0;
border-radius:13px;
background:#edf3f1;
color:var(--text);
font-weight:bold;
}

body.dark .mi{
background:#222c28;
}

/* MODAL */

.modal-bg{
display:none;
position:fixed;
z-index:120;
inset:0;
background:#0008;
padding:12px;
overflow:auto;
}

.modal-bg.show{
display:block;
}

.modal{
max-width:760px;
margin:20px auto;
background:var(--card);
color:var(--text);
border-radius:24px;
padding:16px;
}

/* CALCULATOR */

.calc{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
}

.calc input{
grid-column:1/-1;
font-size:25px;
text-align:right;
}

.calc button{
padding:14px;
border:0;
border-radius:10px;
background:#e8efed;
color:var(--text);
font-weight:bold;
}

/* MEMO */

.memo{
background:#fff;
color:#111;
border:1px solid #aaa;
padding:22px;
max-width:700px;
margin:12px auto;
}

.memo h2{
margin-top:0;
}

.rule{
border-top:4px solid var(--green);
margin:14px 0;
}

.memo table{
width:100%;
border-collapse:collapse;
font-size:10px;
}

.memo th,.memo td{
border:1px solid #999;
padding:6px;
}

.memo th{
background:var(--green);
color:#fff;
}

.signature{
display:flex;
justify-content:space-between;
margin-top:50px;
}

/* THEME */

.themes{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.theme{
height:70px;
border:0;
border-radius:14px;
color:white;
font-weight:bold;
}

/* ISLAMIC MENU */

.islamic-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.big-option{
border:1px solid var(--border);
border-radius:18px;
padding:15px;
background:var(--card);
text-align:center;
font-weight:bold;
color:var(--text);
}

.big-option .ico{
font-size:30px;
display:block;
margin-bottom:6px;
}

/* RAMADAN */

.countdown{
font-size:25px;
font-weight:bold;
text-align:center;
padding:18px;
border-radius:18px;
background:linear-gradient(135deg,#087f5b,#174b3d);
color:white;
}

/* HADITH */

.hadith-option{
display:flex;
gap:12px;
align-items:center;
padding:14px;
border:1px solid var(--border);
border-radius:17px;
margin:8px 0;
background:var(--card);
color:var(--text);
}

.hadith-option .ico{
font-size:29px;
}

/* PIN */

.pin-dots{
font-size:25px;
letter-spacing:8px;
text-align:center;
}

/* READING */

body.reading{
font-size:18px;
line-height:1.9;
}

body.reading .card{
border-radius:8px;
}

@media(max-width:520px){
.row{grid-template-columns:1fr}
.grid{gap:7px}
.card{padding:12px}
.memo{padding:12px}
.memo table{font-size:8px}
}

@media print{
body>*{
display:none!important;
}
.modal-bg.show{
display:block!important;
position:static;
background:#fff;
padding:0;
}
.modal{
max-width:none;
}
.no-print{
display:none!important;
}
}
</style>
</head>

<body>

<header id="header">

<div class="top">

<button class="menu" onclick="toggleMenu()">☰</button>

<div>
<h1 id="appTitle">আমার ব্যক্তিগত হিসাব খাতা</h1>
<div>Hussain's Money Management</div>
</div>

</div>

<div id="clock" class="clock">--:--:--</div>

<div id="dates" class="dates"></div>

<div id="prayerPills" class="prayer-pills"></div>

</header>


<!-- DRAWER -->

<div id="shade" class="shade" onclick="toggleMenu()"></div>

<aside id="drawer" class="drawer">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>☰ Menu</h2>
<button class="btn" onclick="toggleMenu()">✕</button>
</div>

<button class="mi" onclick="goTo('home')">
🏠 <span>Home</span>
</button>

<button class="mi" onclick="goTo('entry')">
💰 <span>নতুন হিসাব</span>
</button>

<button class="mi" onclick="goTo('history')">
📋 <span>হিসাব তালিকা</span>
</button>

<button class="mi" onclick="goTo('report')">
📊 <span>রিপোর্ট ও গ্রাফ</span>
</button>

<button class="mi" onclick="calculator()">
🧮 <span>Calculator</span>
</button>

<button class="mi" onclick="memo()">
📄 <span>Statement Memo</span>
</button>

<button class="mi" onclick="goTo('task')">
📌 <span>Task</span>
</button>

<button class="mi" onclick="islamicMenu()">
🕌 <span>ইসলামিক</span>
</button>

<button class="mi" onclick="hadithQuranMenu()">
📖 <span>হাদিস & কুরআন</span>
</button>

<button class="mi" onclick="backup()">
💾 <span>Backup</span>
</button>

<button class="mi" onclick="restore()">
📥 <span>Restore</span>
</button>

<button class="mi" onclick="suggestion()">
📝 <span>পরামর্শ বক্স</span>
</button>

<button class="mi" onclick="settings()">
⚙️ <span>Settings</span>
</button>

</aside>


<main>

<!-- HOME -->

<section id="home" class="grid">

<div class="card stat green">
💰 আয়
<b id="income">0 BDT</b>
</div>

<div class="card stat red">
💸 ব্যয়
<b id="expense">0 BDT</b>
</div>

<div class="card stat">
💵 অবশিষ্ট
<b id="balance">0 BDT</b>
</div>

<div class="card stat gold">
🤝 দেনা
<b id="debt">0 BDT</b>
</div>

<div class="card stat blue full">
💳 পাওনা
<b id="receive">0 BDT</b>
</div>

</section>


<!-- ENTRY -->

<section id="entry" class="card">

<h2>➕ নতুন হিসাব</h2>

<div class="row">

<div>
<label>📅 তারিখ</label>
<input id="date" type="date">
</div>

<div>
<label>⏰ সময়</label>
<input id="time" type="time">
</div>

</div>

<div class="row">

<div>
<label>📂 ধরন</label>

<select id="type">
<option value="income">💰 আয়</option>
<option value="expense">💸 ব্যয়</option>
<option value="debt">🤝 দেনা</option>
<option value="receive">💳 পাওনা</option>
</select>

</div>

<div>
<label>💵 পরিমাণ</label>
<input id="amount" type="number" inputmode="decimal" placeholder="0">
</div>

</div>

<label>📒 আয়/ব্যয়ের খাত</label>
<input id="category" placeholder="বেতন / বাজার / বিল / অন্যান্য">

<label>📝 বিবরণ</label>
<input id="description" placeholder="ঐচ্ছিক">

<div class="actions">

<button class="btn primary" onclick="addEntry()">
💾 সংরক্ষণ
</button>

<button class="btn" onclick="clearForm()">
↺ পরিষ্কার
</button>

</div>

</section>


<!-- HISTORY -->

<section id="history" class="card">

<h2>📋 হিসাব তালিকা</h2>

<div class="row">

<input id="search" oninput="render()" placeholder="🔎 খুঁজুন">

<select id="monthFilter" onchange="render()">
<option value="">সব মাস</option>
<option value="01">জানুয়ারি</option>
<option value="02">ফেব্রুয়ারি</option>
<option value="03">মার্চ</option>
<option value="04">এপ্রিল</option>
<option value="05">মে</option>
<option value="06">জুন</option>
<option value="07">জুলাই</option>
<option value="08">আগস্ট</option>
<option value="09">সেপ্টেম্বর</option>
<option value="10">অক্টোবর</option>
<option value="11">নভেম্বর</option>
<option value="12">ডিসেম্বর</option>
</select>

</div>

<div id="entries" class="list"></div>

</section>


<!-- REPORT -->

<section id="report" class="card">

<h2>📊 রিপোর্ট ও বৃত্ত গ্রাফ</h2>

<div class="grid">

<div class="card stat green">
মোট আয়
<b id="reportIncome">0 BDT</b>
</div>

<div class="card stat red">
মোট ব্যয়
<b id="reportExpense">0 BDT</b>
</div>

</div>

<canvas id="pie"
width="330"
height="270"
style="max-width:100%">
</canvas>

<div id="legend" class="muted"></div>

</section>


<!-- TASK -->

<section id="task" class="card">

<h2>📌 Task</h2>

<div class="row">

<div>
<label>📅 তারিখ</label>
<input id="taskDate" type="date">
</div>

<div>
<label>⏰ সময়</label>
<input id="taskTime" type="time">
</div>

</div>

<label>📝 Task</label>
<input id="taskText" placeholder="কাজ লিখুন">

<button class="btn primary" style="margin-top:9px"
onclick="addTask()">
📌 Task যোগ করুন
</button>

<div id="tasks" class="list"></div>

</section>

</main>


<!-- BOTTOM ICON BAR -->

<nav class="bottom">

<button class="nav active" onclick="goTo('home')">
<span>🏠</span>Home
</button>

<button class="nav" onclick="goTo('entry')">
<span>💰</span>হিসাব
</button>

<button class="nav" onclick="goTo('report')">
<span>📊</span>রিপোর্ট
</button>

<button class="nav" onclick="calculator()">
<span>🧮</span>Calc
</button>

<button class="nav" onclick="memo()">
<span>📄</span>Memo
</button>

<button class="nav" onclick="islamicMenu()">
<span>🕌</span>ইসলামিক
</button>

<button class="nav" onclick="hadithQuranMenu()">
<span>📖</span>হাদিস
</button>

</nav>


<!-- MODAL -->

<div id="modalBg" class="modal-bg">
<div id="modal" class="modal"></div>
</div>


<script>

/* =========================
DATABASE
========================= */

const STORAGE_KEY="HUSSAIN_PERSONAL_LEDGER";

let db=JSON.parse(
localStorage.getItem(STORAGE_KEY) ||
'{"entries":[],"tasks":[],"lang":"bn","theme":"bd","dark":false,"reading":false,"pin":""}'
);

function save(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function $(id){
return document.getElementById(id);
}

function money(value){
return Number(value||0).toLocaleString(undefined,{
maximumFractionDigits:2
})+" BDT";
}

function toggleMenu(){
$("drawer").classList.toggle("open");
$("shade").classList.toggle("show");
}

function goTo(id){
$("drawer").classList.remove("open");
$("shade").classList.remove("show");
$(id).scrollIntoView({behavior:"smooth"});
}

function openModal(html){
$("modal").innerHTML=html;
$("modalBg").classList.add("show");
}

function closeModal(){
$("modalBg").classList.remove("show");
}


/* =========================
ACCOUNTING
========================= */

function addEntry(){

const amount=Number($("amount").value);

if(!amount){
alert("পরিমাণ লিখুন");
return;
}

db.entries.unshift({
id:Date.now(),
date:$("date").value,
time:$("time").value,
type:$("type").value,
amount:amount,
category:$("category").value||"—",
description:$("description").value||""
});

save();
clearForm();
render();
}

function clearForm(){
$("amount").value="";
$("category").value="";
$("description").value="";
}

function total(type){
return db.entries
.filter(x=>x.type===type)
.reduce((sum,x)=>sum+Number(x.amount),0);
}

function render(){

let search=($("search").value||"").toLowerCase();
let month=$("monthFilter").value;

let list=db.entries.filter(x=>{

let text=(x.category+" "+x.description+" "+x.type).toLowerCase();

let matchSearch=text.includes(search);

let matchMonth=!month ||
(x.date||"").slice(5,7)===month;

return matchSearch&&matchMonth;
});

$("entries").innerHTML=list.length?

list.map(x=>`

<div class="item">

<div>

<b>${x.category}</b>

<br>

<small>
${x.date} • ${x.time} • ${typeName(x.type)}
${x.description?" • "+x.description:""}
</small>

</div>

<div>

<b>${money(x.amount)}</b>

<br>

<button class="btn"
onclick="editEntry(${x.id})">
✏️
</button>

<button class="btn danger"
onclick="deleteEntry(${x.id})">
🗑️
</button>

</div>

</div>

`).join("")

:

`<div class="muted" style="text-align:center">
কোনো হিসাব নেই
</div>`;

$("income").textContent=money(total("income"));
$("expense").textContent=money(total("expense"));
$("balance").textContent=money(total("income")-total("expense"));
$("debt").textContent=money(total("debt"));
$("receive").textContent=money(total("receive"));

$("reportIncome").textContent=money(total("income"));
$("reportExpense").textContent=money(total("expense"));

drawPie();
}

function typeName(type){

if(type==="income")return"আয়";
if(type==="expense")return"ব্যয়";
if(type==="debt")return"দেনা";

return"পাওনা";
}

function deleteEntry(id){

if(!confirm("এই হিসাবটি মুছে ফেলবেন?"))return;

db.entries=db.entries.filter(x=>x.id!==id);

save();
render();
}

function editEntry(id){

const x=db.entries.find(a=>a.id===id);

if(!x)return;

$("date").value=x.date;
$("time").value=x.time;
$("type").value=x.type;
$("amount").value=x.amount;
$("category").value=x.category;
$("description").value=x.description;

db.entries=db.entries.filter(a=>a.id!==id);

save();
render();

goTo("entry");

}


/* =========================
PIE
========================= */

function drawPie(){

const canvas=$("pie");
const ctx=canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

const values=[
total("income"),
total("expense"),
total("debt"),
total("receive")
];

const sum=values.reduce((a,b)=>a+b,0);

if(!sum){

$("legend").textContent="হিসাব যোগ করলে গ্রাফ দেখা যাবে";
return;
}

const colors=[
"#087f5b",
"#d71920",
"#c69214",
"#3976c7"
];

let start=-Math.PI/2;

values.forEach((value,i)=>{

if(!value)return;

const end=start+(value/sum)*Math.PI*2;

ctx.beginPath();
ctx.moveTo(165,135);
ctx.arc(165,135,100,start,end);
ctx.fillStyle=colors[i];
ctx.fill();

start=end;

});

ctx.beginPath();
ctx.arc(165,135,45,0,Math.PI*2);
ctx.fillStyle=getComputedStyle(document.body)
.getPropertyValue("--card");
ctx.fill();

$("legend").innerHTML=
"💰 আয়: "+money(values[0])+
" &nbsp; 💸 ব্যয়: "+money(values[1])+
" &nbsp; 🤝 দেনা: "+money(values[2])+
" &nbsp; 💳 পাওনা: "+money(values[3]);
}


/* =========================
TASK
========================= */

function addTask(){

if(!$("taskText").value.trim()){
alert("Task লিখুন");
return;
}

db.tasks.unshift({
id:Date.now(),
date:$("taskDate").value,
time:$("taskTime").value,
text:$("taskText").value,
done:false
});

save();

$("taskText").value="";

renderTasks();
}

function renderTasks(){

$("tasks").innerHTML=db.tasks.map(x=>`

<div class="item">

<div>
<b>${x.done?"✅":"📌"} ${x.text}</b>
<br>
<small>${x.date} • ${x.time}</small>
</div>

<div>

<button class="btn"
onclick="taskDone(${x.id})">
✓
</button>

<button class="btn danger"
onclick="taskDelete(${x.id})">
🗑️
</button>

</div>

</div>

`).join("") ||

`<div class="muted">কোনো Task নেই</div>`;

}

function taskDone(id){

const x=db.tasks.find(a=>a.id===id);

/* =========================
RAMADAN
========================= */

function ramadan(){

const now=new Date();

let year=now.getFullYear();

let ramadanStart=new Date(year,1,18);

if(now>ramadanStart){
ramadanStart=new Date(year+1,1,8);
}

openModal(`

<h2>🌙 Ramadan Countdown</h2>

<div class="countdown" id="ramadanTimer">
লোড হচ্ছে...
</div>

<p class="muted" style="text-align:center">
সম্ভাব্য রমাদ্বান শুরু: ${ramadanStart.toLocaleDateString("bn-BD")}
</p>

<div class="actions">
<button class="btn" onclick="closeModal()">✕</button>
</div>
`);

function tick(){

const diff=ramadanStart-new Date();

if(diff<=0){

$("ramadanTimer").innerHTML=
"🌙 রমাদ্বান মোবারক";

return;
}

const days=Math.floor(diff/86400000);
const hours=Math.floor(diff/3600000)%24;
const minutes=Math.floor(diff/60000)%60;
const seconds=Math.floor(diff/1000)%60;

$("ramadanTimer").innerHTML=
"🌙 "+days+" দিন<br>"+
hours+" ঘণ্টা "+
minutes+" মিনিট "+
seconds+" সেকেন্ড";

}

tick();

setInterval(tick,1000);
}
