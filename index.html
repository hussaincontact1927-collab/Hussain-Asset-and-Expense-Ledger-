<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUSSAIN • Personal Ledger</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --primary:#1677ff;
  --dark:#0d172b;
  --dark2:#16233d;
  --bg:#f4f6fa;
  --card:#ffffff;
  --text:#172033;
  --muted:#778195;
  --green:#159447;
  --red:#d94b3d;
  --blue:#2475db;
  --border:#e5e9f0;
  --shadow:0 8px 25px rgba(15,30,55,.07);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;
}

body.dark{
  --bg:#09111f;
  --card:#111c2e;
  --text:#f3f6fb;
  --muted:#aab5c7;
  --border:#25334a;
  --shadow:0 8px 25px rgba(0,0,0,.25);
}

header{
  background:
    linear-gradient(135deg,#0b1529,#162745);
  color:white;
  padding:24px 20px 18px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.brand h1{
  margin:0;
  font-size:30px;
  letter-spacing:.5px;
}

.brand p{
  margin:5px 0 0;
  color:#b8c4d7;
  font-size:14px;
}

.date-box{
  text-align:right;
  line-height:1.6;
}

.time{
  font-size:20px;
  font-weight:700;
}

.date{
  font-size:14px;
  color:#d6deeb;
}

.calendar{
  font-size:12px;
  color:#aebbd0;
}

.nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  margin-top:22px;
}

.nav button{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:white;
  height:58px;
  border-radius:17px;
  font-size:23px;
  cursor:pointer;
}

.nav button.active{
  background:white;
  color:#15223a;
}

.container{
  width:min(900px,calc(100% - 28px));
  margin:18px auto 100px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:#e9edf4;
  padding:5px;
  border-radius:30px;
  margin-bottom:18px;
}

.tabs button{
  border:0;
  padding:13px 8px;
  border-radius:25px;
  background:transparent;
  font-size:16px;
  color:#566173;
}

.tabs button.active{
  background:var(--primary);
  color:white;
  font-weight:700;
  box-shadow:0 5px 15px rgba(22,119,255,.25);
}

.date-info{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  box-shadow:var(--shadow);
}

.date-info div{
  text-align:center;
}

.date-info small{
  color:var(--muted);
  display:block;
}

.date-info strong{
  display:block;
  margin-top:4px;
}

.balance{
  margin-top:18px;
  background:linear-gradient(135deg,#0d172b,#182846);
  color:white;
  border-radius:25px;
  padding:25px;
  box-shadow:var(--shadow);
}

.balance small{
  color:#aebbd0;
  font-size:14px;
}

.balance .amount{
  font-size:39px;
  font-weight:800;
  margin:5px 0;
}

.balance-row{
  display:flex;
  gap:20px;
  color:#c8d2e2;
  font-size:13px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.card small{
  color:var(--muted);
  font-size:14px;
}

.card strong{
  display:block;
  font-size:27px;
  margin-top:7px;
}

.income strong{color:var(--green)}
.expense strong{color:var(--red)}
.receive strong{color:var(--blue)}
.give strong{color:#7c4dcc}

.section{
  margin-top:25px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  font-size:21px;
}

.section-title button{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:700;
}

.transaction{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:var(--shadow);
}

.tx-icon{
  width:47px;
  height:47px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:20px;
  background:#eef4ff;
}

.tx-info{
  flex:1;
}

.tx-title{
  font-weight:700;
}

.tx-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.tx-amount{
  font-weight:800;
}

.plus{color:var(--green)}
.minus{color:var(--red)}

.empty{
  background:var(--card);
  border:1px dashed var(--border);
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  border-radius:20px;
}

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:23px;
  padding:20px;
  box-shadow:var(--shadow);
}

.form-card h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:14px;
  font-size:15px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(22,119,255,.1);
}

textarea{
  resize:vertical;
  min-height:80px;
}

.full{
  grid-column:1/-1;
}

.primary{
  width:100%;
  border:0;
  background:var(--primary);
  color:white;
  padding:15px;
  border-radius:15px;
  font-size:16px;
  font-weight:700;
  margin-top:15px;
}

.secondary{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:13px 16px;
  border-radius:13px;
  font-weight:700;
}

.fab{
  position:fixed;
  right:22px;
  bottom:75px;
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  background:var(--primary);
  color:white;
  font-size:34px;
  box-shadow:0 10px 25px rgba(22,119,255,.35);
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  z-index:20;
}

.bottom-nav button{
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

.bottom-nav span{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.bottom-nav button.active{
  color:var(--primary);
  font-weight:700;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:28px 28px 0 0;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  background:#edf1f6;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:20px;
}

.payment-methods{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.payment-method{
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--card);
  color:var(--text);
  text-align:left;
}

.payment-method.active{
  border:2px solid var(--primary);
  background:#eef5ff;
}

.pay-info{
  margin-top:14px;
  background:#f0f4fa;
  border-radius:15px;
  padding:15px;
  color:#26344a;
}

body.dark .pay-info{
  background:#19263b;
  color:#e5ebf4;
}

.pay-number{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
}

.copy{
  border:0;
  background:var(--primary);
  color:white;
  border-radius:10px;
  padding:9px 12px;
  margin-top:8px;
}

.qr{
  display:block;
  width:190px;
  height:190px;
  object-fit:contain;
  margin:15px auto;
  background:white;
  padding:10px;
  border-radius:15px;
}

.notice{
  padding:13px;
  background:#fff6dd;
  color:#775d18;
  border-radius:13px;
  font-size:13px;
  margin-top:12px;
}

body.dark .notice{
  background:#3b311b;
  color:#f3d889;
}

.settings{
  display:grid;
  gap:10px;
}

.setting-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:16px;
  border-radius:15px;
  text-align:left;
  font-size:15px;
}

@media(max-width:600px){
  .header-top{
    flex-direction:column;
  }

  .date-box{
    text-align:left;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .date-info{
    grid-template-columns:1fr 1fr 1fr;
    font-size:12px;
  }

  .brand h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-top">

    <div class="brand">
      <h1>HUSSAIN</h1>
      <p>Personal Ledger • হিসাবের খাতা</p>
    </div>

    <div class="date-box">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="englishDate">--</div>
      <div class="calendar" id="banglaDate">--</div>
      <div class="calendar" id="hijriDate">--</div>
    </div>

  </div>

  <div class="nav">
    <button class="active" onclick="showPage('home',this)">⌂</button>
    <button onclick="showPage('transactions',this)">☷</button>
    <button onclick="openTransaction()">＋</button>
    <button onclick="showPage('payment',this)">◉</button>
    <button onclick="showPage('settings',this)">⚙</button>
  </div>

</header>

<main class="container">

  <!-- HOME -->

  <section id="home">

    <div class="tabs">
      <button onclick="setPeriod('today',this)">আজ</button>
      <button class="active" onclick="setPeriod('month',this)">এই মাস</button>
      <button onclick="setPeriod('all',this)">মোট</button>
    </div>

    <div class="balance">
      <small>বর্তমান ব্যালেন্স</small>
      <div class="amount" id="balance">৳০</div>

      <div class="balance-row">
        <span>আয় <b id="smallIncome">৳০</b></span>
        <span>ব্যয় <b id="smallExpense">৳০</b></span>
      </div>
    </div>

    <div class="cards">

      <div class="card income">
        <small>মোট আয়</small>
        <strong id="income">৳০</strong>
      </div>

      <div class="card expense">
        <small>মোট ব্যয়</small>
        <strong id="expense">৳০</strong>
      </div>

      <div class="card receive">
        <small>মোট পাওনা</small>
        <strong id="receive">৳০</strong>
      </div>

      <div class="card give">
        <small>মোট দেনা</small>
        <strong id="give">৳০</strong>
      </div>

    </div>

    <div class="section">

      <div class="section-title">
        <h2>সাম্প্রতিক হিসাব</h2>
        <button onclick="showPage('transactions')">সব দেখুন →</button>
      </div>

      <div id="recent"></div>

    </div>

  </section>


  <!-- TRANSACTIONS -->

  <section id="transactions" style="display:none">

    <div class="section-title">
      <h2>লেনদেন</h2>
      <button onclick="openTransaction()">＋ নতুন</button>
    </div>

    <div class="form-card">

      <div class="grid">

        <div>
          <label>মাস</label>
          <select id="filterMonth" onchange="render()">
            <option value="all">সব মাস</option>
            <option value="0">জানুয়ারি</option>
            <option value="1">ফেব্রুয়ারি</option>
            <option value="2">মার্চ</option>
            <option value="3">এপ্রিল</option>
            <option value="4">মে</option>
            <option value="5">জুন</option>
            <option value="6">জুলাই</option>
            <option value="7">আগস্ট</option>
            <option value="8">সেপ্টেম্বর</option>
            <option value="9">অক্টোবর</option>
            <option value="10">নভেম্বর</option>
            <option value="11">ডিসেম্বর</option>
          </select>
        </div>

        <div>
          <label>ধরন</label>
          <select id="filterType" onchange="render()">
            <option value="all">সব ধরনের</option>
            <option value="income">আয়</option>
            <option value="expense">ব্যয়</option>
            <option value="receive">পাওনা</option>
            <option value="give">দেনা</option>
          </select>
        </div>

      </div>

    </div>

    <div class="section">
      <div id="allTransactions"></div>
    </div>

  </section>


  <!-- PAYMENT -->

  <section id="payment" style="display:none">

    <div class="section-title">
      <h2>পেমেন্ট করুন</h2>
    </div>

    <div class="form-card">

      <h2>বিল / পেমেন্ট</h2>

      <div class="grid">

        <div>
          <label>বিলের পরিমাণ</label>
          <input id="payAmount" type="number" placeholder="৳ 0">
        </div>

        <div>
          <label>বিল / Reference No.</label>
          <input id="billNo" placeholder="যেমন: HUS-1001">
        </div>

        <div class="full">
          <label>আপনার নাম</label>
          <input id="payerName" placeholder="নাম লিখুন">
        </div>

      </div>

      <label style="margin-top:15px">পেমেন্ট মাধ্যম</label>

      <div class="payment-methods">

        <button class="payment-method active"
                onclick="selectPayment('bKash',this)">
          📱 bKash
        </button>

        <button class="payment-method"
                onclick="selectPayment('Nagad',this)">
          🟠 নগদ
        </button>

        <button class="payment-method"
                onclick="selectPayment('mCash',this)">
          📲 mCash
        </button>

        <button class="payment-method"
                onclick="selectPayment('Bank',this)">
          🏦 Bank Transfer
        </button>

        <button class="payment-method"
                onclick="selectPayment('Card',this)">
          💳 Card Payment
        </button>

        <button class="payment-method"
                onclick="selectPayment('QR',this)">
          🔳 বাংলা QR
        </button>

      </div>

      <div id="paymentInfo"></div>

      <button class="primary" onclick="processPayment()">
        পেমেন্ট সম্পন্ন করুন
      </button>

    </div>

  </section>


  <!-- SETTINGS -->

  <section id="settings" style="display:none">

    <div class="section-title">
      <h2>সেটিংস</h2>
    </div>

    <div class="settings">

      <button class="setting-btn" onclick="toggleDark()">
        🌙 Dark Mode চালু / বন্ধ
      </button>

      <button class="setting-btn" onclick="downloadJSON()">
        💾 সম্পূর্ণ Backup Download
      </button>

      <button class="setting-btn" onclick="downloadCSV()">
        📊 হিসাব CSV Download
      </button>

      <button class="setting-btn" onclick="clearAll()">
        🗑️ সব হিসাব মুছে ফেলুন
      </button>

    </div>

  </section>

</main>


<button class="fab" onclick="openTransaction()">＋</button>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button class="active" onclick="showPage('home',this)">
    <span>⌂</span>
    হোম
  </button>

  <button onclick="showPage('transactions',this)">
    <span>☷</span>
    লেনদেন
  </button>

  <button onclick="openTransaction()">
    <span>＋</span>
    হিসাব
  </button>

  <button onclick="showPage('payment',this)">
    <span>◉</span>
    পেমেন্ট
  </button>

  <button onclick="showPage('settings',this)">
    <span>⚙</span>
    আরও
  </button>

</div>


<!-- TRANSACTION MODAL -->

<div class="modal" id="transactionModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>নতুন হিসাব</h2>
      <button class="close" onclick="closeTransaction()">×</button>
    </div>

    <div class="grid">

      <div>
        <label>তারিখ</label>
        <input type="date" id="txDate">
      </div>

      <div>
        <label>সময়</label>
        <input type="time" id="txTime">
      </div>

      <div>
        <label>ধরন</label>
        <select id="txType">
          <option value="income">আয়</option>
          <option value="expense">ব্যয়</option>
          <option value="receive">পাওনা</option>
          <option value="give">দেনা</option>
        </select>
      </div>

      <div>
        <label>পরিমাণ</label>
        <input type="number" id="txAmount" placeholder="৳ 0">
      </div>

      <div>
        <label>ব্যক্তি / উৎস</label>
        <input id="txPerson" placeholder="যেমন: Salary">
      </div>

      <div>
        <label>ক্যাটাগরি</label>
        <select id="txCategory">
          <option>Salary</option>
          <option>Food</option>
          <option>Gift</option>
          <option>Shopping</option>
          <option>Transport</option>
          <option>Bank</option>
          <option>bKash</option>
          <option>Nagad</option>
          <option>mCash</option>
          <option>Other</option>
        </select>
      </div>

      <div class="full">
        <label>বিবরণ</label>
        <textarea id="txNote" placeholder="বিস্তারিত লিখুন"></textarea>
      </div>

    </div>

    <button class="primary" onclick="saveTransaction()">
      হিসাব সংরক্ষণ করুন
    </button>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let transactions =
  JSON.parse(localStorage.getItem("hussainLedger")) || [];

let selectedPayment = "bKash";
let currentPeriod = "month";


/* =========================
   BANGLA NUMBERS
========================= */

function bnNum(value){

  const map = {
    "0":"০","1":"১","2":"২","3":"৩","4":"৪",
    "5":"৫","6":"৬","7":"৭","8":"৮","9":"৯"
  };

  return String(value)
    .replace(/[0-9]/g,n=>map[n]);

}


/* =========================
   CURRENCY
========================= */

function money(value){

  return "৳" + bnNum(
    Number(value || 0).toLocaleString("en-IN")
  );

}


/* =========================
   DATE
========================= */

const bnDays=[
  "রবিবার","সোমবার","মঙ্গলবার","বুধবার",
  "বৃহস্পতিবার","শুক্রবার","শনিবার"
];

const bnMonths=[
  "জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল",
  "মে","জুন","জুলাই","আগস্ট",
  "সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"
];

const bnBengaliMonths=[
  "বৈশাখ","জ্যৈষ্ঠ","আষাঢ়","শ্রাবণ",
  "ভাদ্র","আশ্বিন","কার্তিক","অগ্রহায়ণ",
  "পৌষ","মাঘ","ফাল্গুন","চৈত্র"
];

function updateClock(){

  const now=new Date();

  let time=now.toLocaleTimeString("en-US",{
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit"
  });

  document.getElementById("time").textContent=time;

  let eng=now.toLocaleDateString("en-US",{
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  });

  document.getElementById("englishDate").textContent=eng;

  document.getElementById("banglaDate").textContent=
    bnDays[now.getDay()]+" • "+
    bnNum(now.getDate())+" "+
    bnMonths[now.getMonth()]+" "+
    bnNum(now.getFullYear());

  let hijri="";

  try{

    hijri=new Intl.DateTimeFormat(
      "bn-u-ca-islamic",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    ).format(now);

  }catch(e){

    hijri="হিজরি তারিখ";

  }

  document.getElementById("hijriDate").textContent=
    hijri;

}


/* =========================
   BENGALI CALENDAR
========================= */

function getBanglaDate(date){

  let year=date.getFullYear();

  let start=new Date(year,3,14);

  if(date<start){

    year--;

    start=new Date(year,3,14);

  }

  let diff=Math.floor(
    (date-start)/(1000*60*60*24)
  );

  let monthLengths=[
    31,31,31,31,31,30,
    30,30,30,30,30,30
  ];

  let month=0;

  while(diff>=monthLengths[month] &&
        month<11){

    diff-=monthLengths[month];

    month++;

  }

  return (
    bnNum(diff+1)+" "+
    bnBengaliMonths[month]+" "+
    bnNum(year+593)
  );

}

function setPeriod(period,button){

    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

/* =========================
   FILTER
========================= */

function getFiltered(){

  const now=new Date();

  return transactions.filter(t=>{

    const d=new Date(t.date+"T"+(t.time||"00:00"));

    if(currentPeriod==="today"){

      return d.toDateString()===now.toDateString();

    }

    if(currentPeriod==="month"){

      return d.getMonth()===now.getMonth()
        && d.getFullYear()===now.getFullYear();

    }

    return true;

  });

}


/* =========================
   RENDER DASHBOARD
========================= */

function render(){

  let data=getFiltered();

  let income=data
    .filter(x=>x.type==="income")
    .reduce((a,b)=>a+Number(b.amount),0);

  let expense=data
    .filter(x=>x.type==="expense")
    .reduce((a,b)=>a+Number(b.amount),0);

  let receive=data
    .filter(x=>x.type==="receive")
    .reduce((a,b)=>a+Number(b.amount),0);

  let give=data
    .filter(x=>x.type==="give")
    .reduce((a,b)=>a+Number(b.amount),0);

  document.getElementById("balance")
    .textContent=money(income-expense);

  document.getElementById("income")
    .textContent=money(income);

  document.getElementById("expense")
    .textContent=money(expense);

  document.getElementById("receive")
    .textContent=money(receive);

  document.getElementById("give")
    .textContent=money(give);

  document.getElementById("smallIncome")
    .textContent=money(income);

  document.getElementById("smallExpense")
    .textContent=money(expense);

  renderRecent(data);

  renderAll();

}


/* =========================
   RECENT
========================= */

function renderRecent(data){

  const box=document.getElementById("recent");

  if(!data.length){

    box.innerHTML=
      `<div class="empty">
        এখনো কোনো হিসাব যোগ করা হয়নি।
      </div>`;

    return;

  }

  let latest=[...data]
    .sort((a,b)=>
      new Date(b.date+"T"+b.time) -
      new Date(a.date+"T"+a.time)
    )
    .slice(0,5);

  box.innerHTML=
    latest.map(transactionHTML).join("");

}


/* =========================
   ALL TRANSACTIONS
========================= */

function renderAll(){

  const box=document.getElementById(
    "allTransactions"
  );

  let data=[...transactions];

  let month=
    document.getElementById("filterMonth")?.value;

  let type=
    document.getElementById("filterType")?.value;

  if(month && month!=="all"){

    data=data.filter(t=>
      new Date(t.date).getMonth()===
      Number(month)
    );

  }

  if(type && type!=="all"){

    data=data.filter(t=>t.type===type);

  }

  data.sort((a,b)=>
    new Date(b.date+"T"+b.time) -
    new Date(a.date+"T"+a.time)
  );

  if(!data.length){

    box.innerHTML=
      `<div class="empty">
        কোনো লেনদেন পাওয়া যায়নি।
      </div>`;

    return;

  }

  box.innerHTML=
    data.map(transactionHTML).join("");

}


/* =========================
   TRANSACTION HTML
========================= */

function transactionHTML(t){

  let isPlus=t.type==="income";

  let typeName={
    income:"আয়",
    expense:"ব্যয়",
    receive:"পাওনা",
    give:"দেনা"
  }[t.type];

  let icon={
    income:"＋",
    expense:"−",
    receive:"↙",
    give:"↗"
  }[t.type];

  let date=new Date(t.date);

  let dateText=
    bnNum(date.getDate())+
    " "+bnMonths[date.getMonth()]+
    " "+bnNum(date.getFullYear());

  return `
    <div class="transaction">

      <div class="tx-icon">
        ${icon}
      </div>

      <div class="tx-info">

        <div class="tx-title">
          ${escapeHTML(t.person || typeName)}
        </div>

        <div class="tx-meta">
          ${dateText}
          • ${t.time || ""}
          • ${typeName}
          • ${escapeHTML(t.category || "")}
        </div>

        ${
          t.note
          ? `<div class="tx-meta">
               ${escapeHTML(t.note)}
             </div>`
          :""
        }

      </div>

      <div class="tx-amount ${
        isPlus ? "plus":"minus"
      }">

        ${isPlus ? "+":"-"}${money(t.amount)}

      </div>

    </div>
  `;

}

function saveTransaction(){

  let amount=Number(
    document.getElementById("txAmount").value
  );

  if(!amount || amount<=0){

    alert("সঠিক পরিমাণ লিখুন।");
    return;

  }

  let tx={

    id:Date.now(),

    date:
      document.getElementById("txDate").value,

    time:
      document.getElementById("txTime").value,

    type:
      document.getElementById("txType").value,

    amount:amount,

    person:
      document.getElementById("txPerson").value,

    category:
      document.getElementById("txCategory").value,

    note:
      document.getElementById("txNote").value

  };

  transactions.push(tx);

  document.getElementById("txPerson").value="";

}

  },

function selectPayment(method,button){

    ".payment-method"
  ).forEach(x=>x.classList.remove("active"));

function renderPaymentInfo(){

  let d=paymentData[selectedPayment];

  let html=`
    <div class="pay-info">

      <strong>${d.title}</strong>

      <p>${d.text}</p>
  `;

  if(d.number){

    html+=`
      <div class="pay-number">
        ${d.number}
      </div>

      <button class="copy"
        onclick="copyText('${d.number}')">
        নম্বর কপি করুন
      </button>
    `;

  }

  if(selectedPayment==="QR"){

    let amount=
      document.getElementById("payAmount").value
      || "0";

    let qrText=
      "HUSSAIN PAYMENT | Amount: "+
      amount+
      " | Account: "+
      d.number;

    let qrURL=
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+
      encodeURIComponent(qrText);

    html+=`
      <img
        class="qr"
        src="${qrURL}"
        alt="বাংলা QR">
    `;

  }

  if(selectedPayment==="Card"){

    html+=`
      <div class="notice">
        নিরাপত্তার কারণে এই HTML আপনার
        Card Number, CVV বা PIN সংরক্ষণ করে না।
        বাস্তব Card Payment-এর জন্য
        Payment Gateway যুক্ত করতে হবে।
      </div>
    `;

  }

  html+=`</div>`;

  document.getElementById(
    "paymentInfo"
  ).innerHTML=html;

}


function copyText(text){

  navigator.clipboard.writeText(text)
    .then(()=>{
      alert("কপি হয়েছে: "+text);
    })
    .catch(()=>{
      alert(text);
    });

}


function processPayment(){

  let amount=Number(
    document.getElementById("payAmount").value
  );

  let name=
    document.getElementById("payerName").value
    || "Payment";

  let bill=
    document.getElementById("billNo").value
    || "No Reference";

  if(!amount || amount<=0){

    alert("পেমেন্টের পরিমাণ লিখুন।");
    return;

  }

  /*
    এখানে বাস্তব Payment Gateway নেই।
    তাই পেমেন্টকে Pending হিসেবে Ledger-এ রাখা হচ্ছে।
  */

  let tx={

    id:Date.now(),

    date:new Date().toISOString().slice(0,10),

    time:new Date().toTimeString().slice(0,5),

    type:"income",

    amount:amount,

    person:name,

    category:selectedPayment,

    note:
      "Payment • "+bill+" • Pending"

  };

  transactions.push(tx);

  localStorage.setItem(
    "hussainLedger",
    JSON.stringify(transactions)
  );

  alert(
    "Payment Request তৈরি হয়েছে।\n\n"+
    "Method: "+selectedPayment+
    "\nAmount: "+money(amount)+
    "\nReference: "+bill+
    "\n\nবাস্তব টাকা গ্রহণ নিশ্চিত করতে Payment Gateway/API প্রয়োজন।"
  );

  render();

}


/* =========================
   DOWNLOAD JSON
========================= */

function downloadJSON(){

  let data=JSON.stringify(
    transactions,
    null,
    2
  );

  let blob=new Blob(
    [data],
    {type:"application/json"}
  );

  downloadBlob(
    blob,
    "HUSSAIN-Ledger-Backup.json"
  );

}


/* =========================
   DOWNLOAD CSV
========================= */

function downloadCSV(){

  let rows=[

    [
      "Date",
      "Time",
      "Type",
      "Amount",
      "Person",
      "Category",
      "Description"
    ]

  ];

  transactions.forEach(t=>{

    rows.push([

      t.date,
      t.time,
      t.type,
      t.amount,
      t.person,
      t.category,
      t.note

    ]);

  });

  let csv=rows.map(row=>
    row.map(x=>
      `"${String(x||"")
        .replace(/"/g,'""')}"`
    ).join(",")
  ).join("\n");

  let blob=new Blob(
    ["\ufeff"+csv],
    {type:"text/csv;charset=utf-8"}
  );

  downloadBlob(
    blob,
    "HUSSAIN-Ledger.csv"
  );

}


function downloadBlob(blob,name){

  let url=URL.createObjectURL(blob);

  let a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

function clearAll(){

  );

  );

  alert("সব হিসাব মুছে ফেলা হয়েছে।");

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   INIT
========================= */

function init(){

  updateClock();

  setInterval(
    updateClock,
    1000
  );

  if(
    localStorage.getItem("hussainDark")
    ==="true"
  ){

    document.body.classList.add("dark");

  }

  renderPaymentInfo();

  render();

}

init();
