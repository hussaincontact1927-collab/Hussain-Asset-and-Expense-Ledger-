<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>আমার ব্যক্তিগত হিসাব খাতা</title>

<style>
*{box-sizing:border-box}

:root{
 --green:#087f5b;
 --red:#d71920;
 --bg:#f3f6f5;
 --card:#fff;
 --text:#17201d;
 --muted:#6d7773;
 --border:#dbe4e1;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 padding-bottom:85px;
}

body.dark{
 --bg:#101513;
 --card:#19201d;
 --text:#f1f5f3;
 --muted:#a9b4af;
 --border:#35423e;
}

/* HEADER */
header{
 color:#fff;
 padding:16px;
 border-radius:0 0 28px 28px;
 background:linear-gradient(120deg,#087f5b 0 58%,#d71920 58%);
 background-size:cover;
 background-position:center;
}

.top{
 display:flex;
 align-items:center;
 gap:10px;
}

.menu{
 width:44px;
 height:44px;
 border:0;
 border-radius:13px;
 background:#ffffff25;
 color:#fff;
 font-size:25px;
}

h1{
 margin:0;
 font-size:21px;
}

.clock{
 margin-top:14px;
 font-size:28px;
 font-weight:bold;
}

.dates{
 margin-top:4px;
 font-size:12px;
 line-height:1.7;
}

.prayer-pills{
 display:flex;
 gap:6px;
 overflow:auto;
 margin-top:10px;
}

.pill{
 white-space:nowrap;
 background:#ffffff20;
 border:1px solid #ffffff35;
 border-radius:12px;
 padding:6px 9px;
 font-size:11px;
}

/* MAIN */
main{
 max-width:920px;
 margin:auto;
 padding:13px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 2px 10px #00000008;
}

.full{
 grid-column:1/-1;
}

.stat b{
 display:block;
 font-size:22px;
 margin-top:5px;
}

.green{color:#087f5b}
.red{color:#d71920}
.blue{color:#3675c8}
.gold{color:#a57900}

label{
 display:block;
 margin:8px 0 4px;
 font-size:13px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:10px;
 border:1px solid var(--border);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
}

textarea{
 min-height:90px;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:10px;
}

.btn{
 border:0;
 border-radius:12px;
 padding:10px 13px;
 background:#e8f1ee;
 color:var(--green);
 font-weight:bold;
}

.primary{
 background:var(--green);
 color:#fff;
}

.danger{
 background:#fde8e9;
 color:#c71928;
}

.list{
 display:grid;
 gap:8px;
 margin-top:10px;
}

.item{
 border:1px solid var(--border);
 border-radius:14px;
 padding:10px;
 display:flex;
 justify-content:space-between;
 gap:8px;
 align-items:center;
}

.muted{
 color:var(--muted);
 font-size:12px;
}

/* BOTTOM ICON NAV */
.bottom{
 position:fixed;
 z-index:50;
 bottom:7px;
 left:7px;
 right:7px;
 background:#fffffff2;
 border:1px solid var(--border);
 border-radius:22px;
 padding:5px;
 display:flex;
 justify-content:space-around;
 box-shadow:0 6px 25px #0002;
 backdrop-filter:blur(10px);
}

body.dark .bottom{
 background:#19201df2;
}

.nav{
 border:0;
 background:transparent;
 color:var(--muted);
 font-size:9px;
 min-width:42px;
 padding:4px;
 border-radius:13px;
}

.nav span{
 display:block;
 font-size:19px;
}

.nav.active{
 background:var(--green);
 color:#fff;
}

/* DRAWER */
.drawer{
 position:fixed;
 z-index:100;
 top:0;
 bottom:0;
 left:-320px;
 width:305px;
 max-width:88%;
 background:var(--card);
 padding:16px;
 overflow:auto;
 transition:.25s;
 box-shadow:8px 0 30px #0003;
}

.drawer.open{
 left:0;
}

.shade{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:90;
}

.shade.show{
 display:block;
}

.mi{
 display:block;
 width:100%;
 border:0;
 text-align:left;
 padding:12px;
 margin:6px 0;
 border-radius:13px;
 background:#edf3f1;
 color:var(--text);
 font-weight:bold;
}

body.dark .mi{
 background:#222c28;
}

/* MODAL */
.modal-bg{
 display:none;
 position:fixed;
 z-index:120;
 inset:0;
 background:#0008;
 padding:12px;
 overflow:auto;
}

.modal-bg.show{
 display:block;
}

.modal{
 max-width:760px;
 margin:20px auto;
 background:var(--card);
 color:var(--text);
 border-radius:24px;
 padding:16px;
}

/* CALCULATOR */
.calc{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
}

.calc input{
 grid-column:1/-1;
 font-size:25px;
 text-align:right;
}

.calc button{
 padding:14px;
 border:0;
 border-radius:10px;
 background:#e8efed;
 color:var(--text);
 font-weight:bold;
}

/* MEMO */
.memo{
 background:#fff;
 color:#111;
 border:1px solid #aaa;
 padding:22px;
 max-width:700px;
 margin:12px auto;
}

.memo h2{
 margin-top:0;
}

.memo .rule{
 border-top:4px solid #087f5b;
 margin:14px 0;
}

.memo table{
 width:100%;
 border-collapse:collapse;
 font-size:10px;
}

.memo th,
.memo td{
 border:1px solid #999;
 padding:6px;
}

.memo th{
 background:#087f5b;
 color:#fff;
}

.signature{
 display:flex;
 justify-content:space-between;
 margin-top:50px;
}

/* THEMES */
.themes{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.theme{
 height:75px;
 border:0;
 border-radius:14px;
 color:#fff;
 font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:520px){
 .row{
  grid-template-columns:1fr;
 }

 .grid{
  gap:7px;
 }

 .card{
  padding:12px;
 }

 .memo{
  padding:12px;
 }

 .memo table{
  font-size:8px;
 }
}

@media print{
 body>*{
  display:none!important;
 }

 .modal-bg.show{
  display:block!important;
  position:static;
  background:#fff;
  padding:0;
 }

 .modal{
  max-width:none;
 }

 .no-print{
  display:none!important;
 }
}
</style>
</head>

<body>

<header id="header">

<div class="top">

<button class="menu" onclick="toggleMenu()">☰</button>

<div>
<h1 id="appTitle">আমার ব্যক্তিগত হিসাব খাতা</h1>
<div>Hussain's Money Management</div>
</div>

</div>

<div id="clock" class="clock">--:--:--</div>

<div id="dates" class="dates"></div>

<div id="prayerPills" class="prayer-pills"></div>

<!-- DRAWER -->

<div id="shade" class="shade" onclick="toggleMenu()"></div>

<aside id="drawer" class="drawer">

<div style="display:flex;justify-content:space-between;align-items:center">

<h2>☰ Menu</h2>

<button class="btn" onclick="toggleMenu()">✕</button>

</div>

<button class="mi" onclick="goTo('home')">🏠 Home</button>

<button class="mi" onclick="goTo('entry')">💰 হিসাব যোগ</button>

<button class="mi" onclick="goTo('history')">📋 হিসাব তালিকা</button>

<button class="mi" onclick="goTo('graph')">📊 বৃত্ত গ্রাফ</button>

<button class="mi" onclick="memo()">📄 Statement Memo</button>

<button class="mi" onclick="goTo('task')">📌 Task</button>

<button class="mi" onclick="goTo('prayer')">🕌 নামাজ ও রোযা</button>

<button class="mi"
onclick="window.open('https://amartafheem.com/','_blank')">
📖 তাহফীমুল কুরআন
</button>

<button class="mi"
onclick="window.open('https://www.hadithbd.com','_blank')">
📜 হাদিস
</button>

<button class="mi" onclick="restore()">📥 Restore</button>

<button class="mi" onclick="suggestion()">📝 পরামর্শ বক্স</button>

<main>

<!-- DASHBOARD -->

<section id="home" class="grid">

<div class="card stat green">
💰 আয়
<b id="income">0 BDT</b>
</div>

<div class="card stat red">
💸 ব্যয়

</div>

💵 অবশিষ্ট
<b id="balance">0 BDT</b>
</div>

<div class="card stat gold">
🤝 দেনা
<b id="debt">0 BDT</b>
</div>

<div class="card stat blue full">
💳 পাওনা
<b id="receive">0 BDT</b>
</div>

</section>


<!-- ENTRY -->

<section id="entry" class="card">

<h2>➕ নতুন হিসাব</h2>

<div class="row">

<div>
<label>📅 তারিখ</label>
<input id="date" type="date">
</div>

<div>
<label>⏰ সময়</label>
<input id="time" type="time">
</div>

</div>


<div class="row">

<div>

<label>📂 ধরন</label>

<select id="type">

<option value="income">💰 আয়</option>

<option value="expense">💸 ব্যয়</option>

id="amount"
type="number"

placeholder="0"

<input
id="category"

>

<input
id="description"
placeholder="ঐচ্ছিক"
>

💾 সংরক্ষণ
</button>

id="search"

<!-- BOTTOM ICONS -->

<nav class="bottom">

<button class="nav active" onclick="goTo('home')">
<span>🏠</span>
Home
</button>

<button class="nav" onclick="goTo('entry')">
<span>💰</span>
হিসাব
</button>

<button class="nav" onclick="goTo('graph')">
<span>📊</span>
Graph
</button>

<button class="nav" onclick="calculator()">
<span>🧮</span>
Calc
</button>

<button class="nav" onclick="memo()">
<span>📄</span>
Memo

<button class="nav" onclick="goTo('task')">
<span>📌</span>
Task

<span>🕌</span>
নামাজ

<span>⚙️</span>
Settings
</button>

</nav>


<!-- MODAL -->

<div id="modalBg" class="modal-bg">

<div id="modal" class="modal"></div>

</div>


<script>

/* =========================
   DATABASE
========================= */

const STORAGE_KEY="HUSSAIN_PERSONAL_LEDGER";

let db=JSON.parse(
 localStorage.getItem(STORAGE_KEY)
 ||
 '{"entries":[],"tasks":[],"lang":"bn","theme":"bd","dark":false}'
);


function save(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(db)
 );

}


/* =========================
   BASIC FUNCTIONS
========================= */

function $(id){

 return document.getElementById(id);

}


function money(value){

 return Number(value||0)
 .toLocaleString(undefined,{
  maximumFractionDigits:2
 })+" BDT";

}


function toggleMenu(){

 $("drawer").classList.toggle("open");

 $("shade").classList.toggle("show");

}


function goTo(id){

 $("drawer").classList.remove("open");

 $("shade").classList.remove("show");

 $(id).scrollIntoView({
  behavior:"smooth"
 });

}


function openModal(html){

 $("modal").innerHTML=html;

 $("modalBg").classList.add("show");

}


function closeModal(){

 $("modalBg").classList.remove("show");

}


/* =========================
   ACCOUNTING
========================= */

function addEntry(){

 const amount=Number($("amount").value);

 if(!amount){

  alert("পরিমাণ লিখুন");

  return;

 }


 db.entries.unshift({

  id:Date.now(),

  date:$("date").value,

  time:$("time").value,

  type:$("type").value,

  amount:amount,

  category:$("category").value || "—",

  description:$("description").value || ""

 });


 save();

 clearForm();

 render();

}


function clearForm(){

 $("amount").value="";

 $("category").value="";

 $("description").value="";

}


function total(type){

 return db.entries
 .filter(x=>x.type===type)
 .reduce((sum,x)=>sum+Number(x.amount),0);

}


function render(){

 let search=($("search").value||"").toLowerCase();

 let list=db.entries.filter(x=>

  (x.category+" "+x.description+" "+x.type)
  .toLowerCase()
  .includes(search)

 );


 $("entries").innerHTML=

 list.length

 ?

 list.map(x=>`

 <div class="item">

 <div>

 <b>${x.category}</b>

 <br>

 <small>

 ${x.date}
 •
 ${x.time}
 •
 ${typeName(x.type)}

 ${x.description ? " • "+x.description : ""}

 </small>

 </div>

 <div>

 <b>${money(x.amount)}</b>

 <br>

 <button
 class="btn danger"
 onclick="deleteEntry(${x.id})">

 🗑️

 </button>

 </div>

 </div>

 `).join("")

 :

 `<div class="muted" style="text-align:center">
 কোনো হিসাব নেই
 </div>`;


 $("income").textContent=money(total("income"));

 $("expense").textContent=money(total("expense"));

 $("balance").textContent=
 money(total("income")-total("expense"));

 $("debt").textContent=money(total("debt"));

 $("receive").textContent=money(total("receive"));

 drawPie();

}


function typeName(type){

 if(type==="income")return"আয়";

 if(type==="expense")return"ব্যয়";

 if(type==="debt")return"দেনা";

 return"পাওনা";

}


function deleteEntry(id){

 if(!confirm("এই হিসাবটি মুছে ফেলবেন?"))return;

 db.entries=db.entries.filter(x=>x.id!==id);

 save();

 render();

}


/* =========================
   PIE GRAPH
========================= */

function drawPie(){

 const canvas=$("pie");

 const ctx=canvas.getContext("2d");

 ctx.clearRect(
 0,
 0,
 canvas.width,
 canvas.height
 );


 const values=[
  total("income"),
  total("expense"),
  total("debt"),
  total("receive")
 ];


 const totalValue=values.reduce(
  (a,b)=>a+b,
  0
 );


 if(!totalValue){

  $("legend").textContent=
  "হিসাব যোগ করলে গ্রাফ দেখা যাবে";

  return;

 }


 const colors=[
  "#087f5b",
  "#d71920",
  "#c69214",
  "#3675c8"
 ];


 let start=-Math.PI/2;


 values.forEach((value,index)=>{

  const end=
   start+
   (value/totalValue)*
   Math.PI*2;


  ctx.beginPath();

  ctx.moveTo(165,135);

  ctx.arc(
   165,
   135,
   100,
   start,
   end
  );

  ctx.fillStyle=colors[index];

  ctx.fill();

  start=end;

 });


 /* CENTER */

 ctx.beginPath();

 ctx.arc(
 165,
 135,
 48,
 0,
 Math.PI*2
 );

 ctx.fillStyle=
 getComputedStyle(document.body)
 .getPropertyValue("--card") ||
 "#fff";

 ctx.fill();


 $("legend").textContent=

 "💰 "+money(values[0])+
 " | 💸 "+money(values[1])+
 " | 🤝 "+money(values[2])+
 " | 💳 "+money(values[3]);

}


/* =========================
   TASK
========================= */

function addTask(){

 if(!$("taskText").value.trim()){

  alert("Task লিখুন");

  return;

 }


 db.tasks.unshift({

  id:Date.now(),

  date:$("taskDate").value,

  time:$("taskTime").value,

  text:$("taskText").value,

  done:false

 });


 save();

 $("taskText").value="";

 renderTasks();

}


function renderTasks(){

 $("tasks").innerHTML=

 db.tasks.map(x=>`

 <div class="item">

 <div>

 <b>
 ${x.done?"✅":"📌"}
 ${x.text}
 </b>

 <br>

 <small>
 ${x.date} • ${x.time}
 </small>

 </div>

 <div>

 <button
 class="btn"
 onclick="taskDone(${x.id})">
 ✓
 </button>

 <button
 class="btn danger"
 onclick="taskDelete(${x.id})">
 🗑️
 </button>

 </div>

 </div>

 `).join("")

 ||

 `<div class="muted" style="text-align:center">
 কোনো Task নেই
 </div>`;

}


function taskDone(id){

 const task=db.tasks.find(
  x=>x.id===id
 );

 if(task){

  task.done=!task.done;

  save();

  renderTasks();

 }

}


function taskDelete(id){

 db.tasks=db.tasks.filter(
  x=>x.id!==id
 );

 save();

 renderTasks();

}


/* =========================
   NORMAL CALCULATOR
========================= */

function calculator(){

 openModal(`

 <h2>🧮 Calculator</h2>

 <div class="calc">

 <input id="calc" readonly>

 <button onclick="calcAdd('7')">7</button>
 <button onclick="calcAdd('8')">8</button>
 <button onclick="calcAdd('9')">9</button>
 <button onclick="calcAdd('/')">÷</button>

 <button onclick="calcAdd('4')">4</button>
 <button onclick="calcAdd('5')">5</button>
 <button onclick="calcAdd('6')">6</button>
 <button onclick="calcAdd('*')">×</button>

 <button onclick="calcAdd('1')">1</button>
 <button onclick="calcAdd('2')">2</button>
 <button onclick="calcAdd('3')">3</button>
 <button onclick="calcAdd('-')">−</button>

 <button onclick="calcAdd('0')">0</button>
 <button onclick="calcAdd('.')">.</button>
 <button onclick="calcAdd('+')">+</button>
 <button onclick="clearCalc()">C</button>

 <button onclick="calcAdd('(')">(</button>
 <button onclick="calcAdd(')')">)</button>
 <button onclick="backspace()">⌫</button>
 <button onclick="calculate()">=</button>

 </div>

 <div class="actions">

 <button class="btn"
 onclick="scientificCalculator()">

 🔬 Scientific Mode

 </button>

 <button class="btn"
 onclick="closeModal()">

 ✕

 </button>

 </div>

 `);

}


function calcAdd(value){

 $("calc").value+=value;

}


function clearCalc(){

 $("calc").value="";

}


function backspace(){

 $("calc").value=
 $("calc").value.slice(0,-1);

}


function calculate(){

 try{

  $("calc").value=
  Function(
   "return "+$("calc").value
  )();

 }catch(e){

  $("calc").value="Error";

 }

}


/* =========================
   SCIENTIFIC
========================= */

function scientificCalculator(){

 openModal(`

 <h2>🔬 Scientific Calculator</h2>

 <div class="calc">

 <input id="calc" readonly>

/* =========================
   RESTORE
========================= */

function restore(){

 const input=
 document.createElement("input");

 input.type="file";

 input.accept=".json";


 input.onchange=function(){

  const reader=
  new FileReader();


  reader.onload=function(){

   try{

    db=JSON.parse(
     reader.result
    );

    save();

    render();

    renderTasks();

    applySettings();

    alert(
     "Backup সফলভাবে Restore হয়েছে।"
    );

   }catch(e){

    alert(
     "Backup ফাইলটি সঠিক নয়।"
    );

   }

  };


  reader.readAsText(
   input.files[0]
  );

 };


 input.click();

}

/* =========================
   NAMAZ API
========================= */

async function loadPrayer(){

 const city=
 $("city").value;

 const country=
 $("country").value;


 const now=new Date();


 const url=

 "https://api.aladhan.com/v1/timingsByCity/"+
 now.getDate()+
 "-"+
 (now.getMonth()+1)+
 "-"+
 now.getFullYear()+
 "?city="+
 encodeURIComponent(city)+
 "&country="+
 encodeURIComponent(country)+
 "&method=1";


 try{

  const response=
  await fetch(url);


  const json=
  await response.json();


  const t=
  json.data.timings;


  const list=[

   ["🌙","সেহরী শেষ সময়",t.Imsak],

   ["🌇","ইফতার / সূর্যাস্ত",t.Maghrib],

   ["🌅","সূর্যোদয়",t.Sunrise],

   ["🕌","ফজর",t.Fajr],

   ["🕌","যোহর",t.Dhuhr],

   ["🕌","আসর",t.Asr],

   ["🕌","মাগরিব",t.Maghrib],

   ["🕌","ইশা",t.Isha]

  ];


  $("prayerList").innerHTML=

  list.map(x=>`

   <div class="item">

   <b>
   ${x[0]} ${x[1]}
   </b>

   <b>
   ${x[2]}
   </b>

   </div>

  `).join("");


  $("prayerPills").innerHTML=

  list.map(x=>`

   <div class="pill">

   ${x[1]}<br>

   <b>${x[2]}</b>

   </div>

  `).join("");


 }catch(error){

  $("prayerList").innerHTML=

  `<div class="muted">

  API থেকে সময় পাওয়া যায়নি।
  ইন্টারনেট সংযোগ পরীক্ষা করুন।

  </div>`;

 }

}


/* =========================
   CLOCK + DATES
========================= */

function updateClock(){

 const now=new Date();


 $("clock").textContent=
 now.toLocaleTimeString();


 $("dates").innerHTML=

 now.toLocaleDateString(
  "bn-BD",
  {
   weekday:"long",
   day:"numeric",
   month:"long",
   year:"numeric"
  }
 )+
 "<br>"+
 now.toLocaleDateString(
  "en-GB",
  {
   day:"2-digit",
   month:"long",
   year:"numeric"
  }
 );


 try{

  $("dates").innerHTML+=

  "<br>🌙 "+

  new Intl.DateTimeFormat(
   "ar-SA-u-ca-islamic",
   {
    day:"numeric",
    month:"long",
    year:"numeric"
   }
  ).format(now);

 }catch(e){}


 setTimeout(
  updateClock,
  1000
 );

}
