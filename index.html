<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hussain's Money Management</title>

<style>
:root{
 --bg:#f3f6f4;
 --card:#fff;
 --text:#17211b;
 --muted:#68756e;
 --line:#dce5e0;
 --green:#006a4e;
 --red:#e31b23;
 --gold:#b17b00;
}
.dark{
 --bg:#0c1511;
 --card:#15201b;
 --text:#eef6f1;
 --muted:#aab7b0;
 --line:#2a3932;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
}
button,input,select,textarea{font:inherit}
.header{
 padding:22px 15px;
 color:#fff;
 background:linear-gradient(135deg,#006a4e 0 50%,#e31b23 50%);
 border-radius:0 0 28px 28px;
}
.head,.wrap{max-width:1050px;margin:auto}
.head{
 display:flex;
 justify-content:space-between;
 gap:15px;
}
.head h1{margin:0;font-size:27px}
.head p{margin:5px 0;font-size:12px}
.clock{text-align:right}
.clock b{font-size:20px}

.wrap{padding:18px 14px 60px}

.week{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;
 margin-bottom:16px;
}
.day{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:9px 2px;
 text-align:center;
}
.day small{
 display:block;
 color:var(--muted);
 font-size:10px;
}
.day.today{
 background:var(--green);
 color:white;
}
.day.today small{color:white}

.cards{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px;
}
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:15px;
}
.card small{color:var(--muted)}
.num{
 font-size:20px;
 font-weight:900;
 margin-top:5px;
}
.green{color:#07864d}
.red{color:#d52b33}
.gold{color:var(--gold)}

.section{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 padding:18px;
 margin-top:16px;
}
.section h2{
 margin:0 0 15px;
 font-size:18px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.full{grid-column:1/-1}

label{
 display:block;
 font-size:12px;
 color:var(--muted);
 margin-bottom:5px;
}
input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
}
textarea{min-height:90px}

.btn{
 border:0;
 border-radius:12px;
 padding:11px 15px;
 font-weight:800;
 cursor:pointer;
}
.primary{
 background:var(--green);
 color:#fff;
}
.soft{
 background:#e8f2ee;
 color:var(--green);
}
.danger{
 background:#ffe8e8;
 color:#c52229;
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 border:1px solid var(--line);
 border-radius:14px;
 padding:12px;
 margin:8px 0;
}
.row small{color:var(--muted)}
.amount{
 font-weight:900;
 text-align:right;
 white-space:nowrap;
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:20px;
}

/* TASK */
.task{
 display:flex;
 align-items:center;
 gap:10px;
 border:1px solid var(--line);
 border-radius:14px;
 padding:12px;
 margin:8px 0;
}
.task.done{opacity:.55}
.task.done .task-text{text-decoration:line-through}
.task-icon{
 font-size:23px;
 width:32px;
 text-align:center;
}
.task-text{flex:1}
.task-text b{display:block}
.task-text small{
 display:block;
 color:var(--muted);
 margin-top:4px;
 font-size:11px;
}
.task-btn{
 width:38px;
 height:38px;
 border:0;
 border-radius:10px;
 cursor:pointer;
 font-size:17px;
}
.task-ok{
 background:#e8f2ee;
 color:var(--green);
}
.task-del{
 background:#ffe8e8;
 color:#c52229;
}

/* NOTES */
.note{
 border:1px solid var(--line);
 border-radius:13px;
 padding:12px;
 margin:8px 0;
}
.note small{color:var(--muted)}

/* REMINDER */
.reminder{
 border-left:4px solid var(--red);
 padding:11px;
 background:#e31b230d;
 border-radius:9px;
 margin:8px 0;
}

/* ICON SETTINGS */
.icon-menu{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}
.icon-item{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 border-radius:14px;
 padding:9px 12px;
 cursor:pointer;
 text-align:center;
}
.icon-item span{
 display:block;
 font-size:21px;
}
.icon-item small{
 color:var(--muted);
 font-size:10px;
}

/* PIN */
#lock{
 position:fixed;
 inset:0;
 background:#0c1712;
 z-index:99;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.lockbox{
 background:#fff;
 color:#17211b;
 width:min(390px,100%);
 padding:28px;
 border-radius:24px;
 text-align:center;
}
.lockbox input{
 text-align:center;
 font-size:23px;
 letter-spacing:6px;
 margin:12px 0;
}

/* MODAL */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:90;
 padding:15px;
 overflow:auto;
}
.modalbox{
 max-width:900px;
 margin:25px auto;
 background:#fff;
 color:#111;
 padding:25px;
}
.close{
 float:right;
 border:0;
 background:none;
 font-size:25px;
 cursor:pointer;
}

/* MEMO */
.memo h1{text-align:center;margin:0}
.memo .sub{text-align:center;color:#555;margin:5px 0 18px}
.memo table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}
.memo th,.memo td{
 border:1px solid #aaa;
 padding:7px;
}
.memo th{background:#eee}
.total{
 margin-top:14px;
 border-top:2px solid #111;
 padding-top:8px;
}
.total div{
 display:flex;
 justify-content:space-between;
 margin:5px;
}
.grand{
 font-size:18px;
 font-weight:900;
}

/* MOBILE */
@media(max-width:750px){
 .cards{
  grid-template-columns:repeat(2,1fr);
 }
 .cards .card:last-child{
  grid-column:1/-1;
 }
 .head{
  flex-direction:column;
 }
 .clock{text-align:left}
}
@media(max-width:560px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .week{gap:3px}
 .day{font-size:11px}
 .head h1{font-size:23px}
}

/* PRINT */
@media print{
 .no-print{display:none!important}
 .modal{
  position:static;
  background:none;
 }
 .modalbox{
  margin:0;
 }
}
</style>
</head>

<body>

<!-- PIN LOCK -->
<div id="lock">

 <div class="lockbox">

  <div style="font-size:40px">🇧🇩</div>

  <h2>Hussain's Money Management</h2>

  <p id="lockMsg">
   PIN দিয়ে প্রবেশ করুন
  </p>

  <input
   id="pin"
   type="password"
   inputmode="numeric"
   maxlength="8"
   placeholder="••••"
  >

  <button
   class="btn primary"
   style="width:100%"
   onclick="enterApp()">
   🔓 প্রবেশ করুন
  </button>

  <button
   id="firstPin"
   class="btn soft"
   style="width:100%;margin-top:8px"
   onclick="setFirstPin()">
   🔐 প্রথম PIN সেট করুন
  </button>

 </div>
</div>


<!-- HEADER -->
<header class="header no-print">

 <div class="head">

  <div>
   <h1>Hussain's Money Management</h1>
   <p>Personal Finance • ব্যক্তিগত হিসাব ব্যবস্থাপনা</p>
  </div>

  <div class="clock">
   <b id="time"></b>
   <br>
   <span id="date"></span>
  </div>

 </div>

</header>


<main class="wrap">

<!-- WEEK -->
<div
 id="week"
 class="week no-print">
</div>


<!-- SUMMARY -->
<div class="cards no-print">

 <div class="card">
  <small>💰 আয়</small>
  <div
   id="income"
   class="num green">
   0 BDT
  </div>
 </div>

 <div class="card">
  <small>💸 ব্যয়</small>
  <div
   id="expense"
   class="num red">
   0 BDT
  </div>
 </div>

 <div class="card">
  <small>💵 অবশিষ্ট</small>
  <div
   id="balance"
   class="num">
   0 BDT
  </div>
 </div>

 <div class="card">
  <small>🤝 দেনা</small>
  <div
   id="debt"
   class="num gold">
   0 BDT
  </div>
 </div>

 <div class="card">
  <small>💳 পাওনা</small>
  <div
   id="receive"
   class="num green">
   0 BDT
  </div>
 </div>

</div>


<!-- NEW ACCOUNT -->
<section class="section no-print">

 <h2>➕ নতুন হিসাব</h2>

 <div class="grid">

  <div>
   <label>📅 তারিখ</label>
   <input id="td" type="date">
  </div>

  <div>
   <label>⏰ সময়</label>
   <input id="tt" type="time">
  </div>

  <div>
   <label>📂 ধরন</label>

   <select id="ty">

    <option value="income">
     💰 আয়
    </option>

    <option value="expense">
     💸 ব্যয়
    </option>

    <option value="debt">
     🤝 দেনা
    </option>

    <option value="receive">
     💳 পাওনা
    </option>

   </select>

  </div>

  <div>
   <label>💵 পরিমাণ</label>
   <input
    id="amt"
    type="number"
    placeholder="6765">
  </div>

  <div>
   <label>📝 বিষয়</label>
   <input
    id="title"
    placeholder="বেতন / বাজার / ভাড়া">
  </div>

  <div>
   <label>📄 বিবরণ</label>
   <input
    id="desc"
    placeholder="ঐচ্ছিক">
  </div>

  <div class="full">

   <button
    class="btn primary"
    onclick="addTransaction()">
    💾 হিসাব সংরক্ষণ
   </button>

  </div>

 </div>

</section>


<!-- STATEMENT -->
<section class="section no-print">

 <h2>📄 Statement</h2>

 <div class="grid">

  <div>
   <label>From</label>
   <input id="from" type="date">
  </div>

  <div>
   <label>To</label>
   <input id="to" type="date">
  </div>

  <div class="full">

   <button
    class="btn primary"
    onclick="previewStatement()">
    👁️ দেখুন
   </button>

   <button
    class="btn soft"
    onclick="downloadStatement()">
    ⬇️ Download
   </button>

   <button
    class="btn soft"
    onclick="printStatement()">
    🖨️ Print / PDF
   </button>

  </div>

 </div>

</section>


<!-- TRANSACTIONS -->
<section class="section no-print">

 <h2>📋 হিসাব</h2>

 <input
  id="search"
  placeholder="🔎 হিসাব খুঁজুন"
  oninput="renderTransactions()">

 <div id="transactions"></div>

</section>


<!-- TASK -->
<section class="section no-print">

 <h2>📌 Task</h2>

 <div class="grid">

  <div>
   <label>📅 তারিখ</label>
   <input id="taskDate" type="date">
  </div>

  <div>
   <label>⏰ সময়</label>
   <input id="taskTime" type="time">
  </div>

  <div class="full">

   <label>📝 Task</label>

   <input
    id="taskText"
    placeholder="যেমন: বিদ্যুৎ বিল দিতে হবে">

  </div>

  <div class="full">

   <button
    class="btn primary"
    onclick="addTask()">
    📌 Task সংরক্ষণ
   </button>

  </div>

 </div>

 <div id="tasks"></div>

</section>


<!-- PERSONAL NOTES -->
<section class="section no-print">

 <h2>📝 Personal Notes</h2>

 <div class="grid">

  <div>
   <label>শিরোনাম</label>
   <input
    id="noteTitle"
    placeholder="গুরুত্বপূর্ণ বিষয়">
  </div>

  <div>
   <label>📅 তারিখ</label>
   <input id="noteDate" type="date">
  </div>

  <div class="full">

   <label>নোট</label>

   <textarea
    id="noteBody"
    placeholder="গুরুত্বপূর্ণ বিষয় লিখুন..."></textarea>

  </div>

  <div>

   <button
    class="btn primary"
    onclick="addNote()">
    📝 সংরক্ষণ
   </button>

  </div>

 </div>

 <div id="notes"></div>

</section>


<!-- REMINDER -->
<section class="section no-print">

 <h2>🔔 Reminder</h2>

 <div class="grid">

  <div>
   <label>📅 তারিখ</label>
   <input id="remDate" type="date">
  </div>

  <div>
   <label>⏰ সময়</label>
   <input id="remTime" type="time">
  </div>

  <div class="full">

   <label>🔔 মনে করানোর বিষয়</label>

   <input
    id="remText"
    placeholder="যেমন: বিল দিতে হবে">

  </div>

  <div>

   <button
    class="btn primary"
    onclick="addReminder()">
    🔔 Reminder সংরক্ষণ
   </button>

  </div>

 </div>

 <div id="reminders"></div>

</section>


<!-- SETTINGS -->
<section class="section no-print">

 <h2>⚙️ Settings</h2>

 <div class="icon-menu">

  <button
   class="icon-item"
   onclick="toggleDark()">
   <span>🌙</span>
   <small>Theme</small>
  </button>

  <button
   class="icon-item"
   onclick="changePin()">
   <span>🔐</span>
   <small>PIN</small>
  </button>

  <button
   class="icon-item"
   onclick="backupData()">
   <span>💾</span>
   <small>Backup</small>
  </button>

  <button
   class="icon-item"
   onclick="document.getElementById('restoreFile').click()">
   <span>♻️</span>
   <small>Restore</small>
  </button>

  <button
   class="icon-item"
   onclick="clearData()">
   <span>🗑️</span>
   <small>Clear</small>
  </button>

  <input
   id="restoreFile"
   type="file"
   accept=".json"
   hidden
   onchange="restoreData(event)">

 </div>

</section>

</main>


<!-- STATEMENT MODAL -->
<div
 id="modal"
 class="modal">

 <div class="modalbox">

  <button
   class="close"
   onclick="closeModal()">
   ×
  </button>

  <div id="memo"></div>

 </div>

</div>


<script>

/* =========================
   DATABASE
========================= */

const STORAGE_KEY =
 "HUSSAIN_MONEY_MANAGEMENT_V3";


let D =
 JSON.parse(
  localStorage.getItem(STORAGE_KEY)
  ||
  '{"tx":[],"tasks":[],"notes":[],"reminders":[],"pin":"","dark":false}'
 );


D.tx = D.tx || [];
D.tasks = D.tasks || [];
D.notes = D.notes || [];
D.reminders = D.reminders || [];


/* =========================
   BASIC FUNCTIONS
========================= */

function $(id){

 return document.getElementById(id);

}


function save(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(D)
 );

}


function today(){

 return new Date()
  .toISOString()
  .slice(0,10);

}


function money(number){

 return Number(number || 0)
  .toLocaleString(
   "en-US",
   {
    maximumFractionDigits:2
   }
  )
  + " BDT";

}


function escapeHTML(value){

 return String(value || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function toast(message){

 alert(message);

}


/* =========================
   DEFAULT DATE / TIME
========================= */

function setDefaults(){

 const d =
  new Date();

 $("td").value =
  today();

 $("noteDate").value =
  today();

 $("remDate").value =
  today();

 $("taskDate").value =
  today();

 $("from").value =
  today();

 $("to").value =
  today();

 $("tt").value =
  d.toTimeString().slice(0,5);

 $("taskTime").value =
  d.toTimeString().slice(0,5);

 $("remTime").value =
  d.toTimeString().slice(0,5);

}


/* =========================
   CLOCK
========================= */

function updateClock(){

 const d =
  new Date();

 $("time").textContent =
  d.toLocaleTimeString("en-GB");

 $("date").textContent =
  d.toLocaleDateString(
   "en-GB",
   {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
   }
  );

 renderWeek();

 checkReminders();

}


function renderWeek(){

 const d =
  new Date();

 const day =
  d.getDay();

 const monday =
  new Date(d);

 const diff =
  day === 0
   ? -6
   : 1 - day;

 monday.setDate(
  d.getDate()+diff
 );

 const names =
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

 $("week").innerHTML =
  names.map(
   (name,index)=>{

    const q =
     new Date(monday);

    q.setDate(
     monday.getDate()+index
    );

    const date =
     q.toISOString()
      .slice(0,10);

    return `

     <div
      class="day
      ${date===today()?"today":""}">

      <small>${name}</small>

      <b>${q.getDate()}</b>

     </div>

    `;

   }
  ).join("");

}


/* =========================
   TRANSACTIONS
========================= */

function addTransaction(){

 const amount =
  Number($("amt").value);

 if(!amount){

  toast("পরিমাণ দিন");

  return;

 }


 D.tx.unshift({

  id:Date.now(),

  date:$("td").value,

  time:$("tt").value,

  type:$("ty").value,

  amount:amount,

  title:$("title").value || "Untitled",

  desc:$("desc").value || ""

 });


 save();

 $("amt").value="";
 $("title").value="";
 $("desc").value="";

 render();

 toast("হিসাব সংরক্ষণ হয়েছে");

}


function render(){

 let income=0;
 let expense=0;
 let debt=0;
 let receive=0;


 D.tx.forEach(
  x=>{

   if(x.type==="income")
    income+=x.amount;

   if(x.type==="expense")
    expense+=x.amount;

   if(x.type==="debt")
    debt+=x.amount;

   if(x.type==="receive")
    receive+=x.amount;

  }
 );


 $("income").textContent =
  money(income);

 $("expense").textContent =
  money(expense);

 $("balance").textContent =
  money(income-expense);

 $("debt").textContent =
  money(debt);

 $("receive").textContent =
  money(receive);


 renderTransactions();
 renderTasks();
 renderNotes();
 renderReminders();

 document.body.classList.toggle(
  "dark",
  D.dark
 );

}


function renderTransactions(){

 const query =
  ($("search").value || "")
  .toLowerCase();


 const list =
  D.tx.filter(
   x=>
    (
     x.title+" "+
     x.desc+" "+
     x.date
    )
    .toLowerCase()
    .includes(query)
  );


 const typeName = {

  income:"আয়",

  expense:"ব্যয়",

  debt:"দেনা",

  receive:"পাওনা"

 };


 if(!list.length){

  $("transactions").innerHTML =
   `<div class="empty">
     📋 কোনো হিসাব নেই।
    </div>`;

  return;

 }


 $("transactions").innerHTML =
  list.map(
   x=>`

    <div class="row">

     <div>

      <b>
       ${escapeHTML(x.title)}
      </b>

      <br>

      <small>
       📅 ${x.date}
       • ⏰ ${x.time}
       • ${typeName[x.type]}
       ${escapeHTML(x.desc)}
      </small>

     </div>


     <div class="amount
      ${x.type==="expense"
       ?"red"
       :
       x.type==="income" ||
       x.type==="receive"
       ?"green"
       :"gold"}">

      ${money(x.amount)}

      <br>

      <button
       class="btn danger"
       style="padding:4px 7px;font-size:10px"
       onclick="deleteTransaction(${x.id})">

       🗑️

      </button>

     </div>

    </div>

   `
  ).join("");

}


function deleteTransaction(id){

 if(!confirm("এই হিসাব মুছে ফেলবেন?"))
  return;

 D.tx =
  D.tx.filter(
   x=>x.id!==id
  );

 save();

 render();

}


/* =========================
   TASK
========================= */

function addTask(){

 const text =
  $("taskText")
   .value
   .trim();

 if(!text){

  toast("Task লিখুন");

  return;

 }


 D.tasks.push({

  id:Date.now(),

  date:$("taskDate").value,

  time:$("taskTime").value,

  text:text,

  done:false

 });


 save();

 $("taskText").value="";

 renderTasks();

 toast("Task সংরক্ষণ হয়েছে");

 requestNotification();

}


function renderTasks(){

 D.tasks.sort(
  (a,b)=>{

   if(a.done!==b.done)
    return a.done-b.done;

   return (
    a.date+a.time
   )
   .localeCompare(
    b.date+b.time
   );

  }
 );


 if(!D.tasks.length){

  $("tasks").innerHTML =
   `<div class="empty">
     📌 কোনো Task নেই।
    </div>`;

  return;

 }


 $("tasks").innerHTML =
  D.tasks.map(
   t=>`

    <div
     class="task
     ${t.done?"done":""}">

     <div class="task-icon">

      ${t.done
       ?"✅"
       :"📌"}

     </div>


     <div class="task-text">

      <b>
       ${escapeHTML(t.text)}
      </b>

      <small>

       📅 ${t.date}

       ${
        t.time
        ? " • ⏰ "+t.time
        :""
       }

      </small>

     </div>


     <button
      class="task-btn task-ok"
      onclick="toggleTask(${t.id})">

      ${t.done?"↩️":"✓"}

     </button>


     <button
      class="task-btn task-del"
      onclick="deleteTask(${t.id})">

      🗑️

     </button>

    </div>

   `
  ).join("");

}


function toggleTask(id){

 const task =
  D.tasks.find(
   x=>x.id===id
  );

 if(!task)return;

 task.done =
  !task.done;

 save();

 renderTasks();

}


function deleteTask(id){

 if(!confirm("Task মুছে ফেলবেন?"))
  return;

 D.tasks =
  D.tasks.filter(
   x=>x.id!==id
  );

 save();

 renderTasks();

}

function checkReminders(){

 const d =
  new Date();

 const date =
  today();

 const time =
  d.toTimeString()
   .slice(0,5);


 D.reminders.forEach(
  r=>{

   if(
    !r.done &&
    r.date===date &&
    r.time===time
   ){

    r.done=true;

    save();

    alert(
     "🔔 Reminder\n\n"+
     r.text
    );

   }

  }
 );

}

  window.Notification &&
  Notification.permission==="default"
 ){

 }

}


/* =========================
   STATEMENT
========================= */

function getStatementData(){

 const from =
  $("from").value;

 const to =
  $("to").value;


 return D.tx
  .filter(
   x=>
    x.date>=from &&
    x.date<=to
  )
  .sort(
   (a,b)=>
    (a.date+a.time)
    .localeCompare(
     b.date+b.time
    )
  );

}


function buildMemo(list){

 let income=0;
 let expense=0;
 let debt=0;
 let receive=0;


 list.forEach(
  x=>{

   if(x.type==="income")
    income+=x.amount;

   if(x.type==="expense")
    expense+=x.amount;

   if(x.type==="debt")
    debt+=x.amount;

   if(x.type==="receive")
    receive+=x.amount;

  }
 );


 const rows =
  list.map(
   (x,i)=>`

    <tr>

     <td>${i+1}</td>

     <td>${x.date}</td>

     <td>${x.time}</td>

     <td>${escapeHTML(x.title)}</td>

     <td>
      ${
       x.type==="income"
       ?"আয়"
       :
       x.type==="expense"
       ?"ব্যয়"
       :
       x.type==="debt"
       ?"দেনা"
       :"পাওনা"
      }
     </td>

     <td>${money(x.amount)}</td>

     <td>${escapeHTML(x.desc)}</td>

    </tr>

   `
  ).join("");


 return `

  <div class="memo">

   <h1>
    Hussain's Money Management
   </h1>

   <div class="sub">
    ACCOUNT STATEMENT • MEMO
   </div>

   <p>
    <b>Statement Period:</b>
    ${$("from").value}
    —
    ${$("to").value}
   </p>

   <table>

    <tr>

     <th>#</th>
     <th>Date</th>
     <th>Time</th>
     <th>Details</th>
     <th>Type</th>
     <th>Amount</th>
     <th>Note</th>

    </tr>

    ${
     rows ||
     `<tr>
       <td colspan="7">
        No transactions
       </td>
      </tr>`
    }

   </table>


   <div class="total">

    <div>
     <span>Total Income</span>
     <b>${money(income)}</b>
    </div>

    <div>
     <span>Total Expense</span>
     <b>${money(expense)}</b>
    </div>

    <div>
     <span>Due</span>
     <b>${money(debt)}</b>
    </div>

    <div>
     <span>Receivable</span>
     <b>${money(receive)}</b>
    </div>

    <div class="grand">
     <span>Remaining</span>
     <b>${money(income-expense)}</b>
    </div>

   </div>


   <p style="
    text-align:center;
    font-size:11px;
    color:#555;
    border-top:1px dashed #888;
    padding-top:10px">

    Hussain's Money Management
    • Personal Financial Record

   </p>

  </div>

 `;

}

/* =========================
   RESTORE
========================= */

function restoreData(event){

 const file =
  event.target.files[0];

 if(!file)return;


 const reader =
  new FileReader();


 reader.onload =
  function(){

   try{

    D =
     JSON.parse(
      reader.result
     );

    D.tx=D.tx||[];
    D.tasks=D.tasks||[];
    D.notes=D.notes||[];
    D.reminders=D.reminders||[];

    save();

    render();

    toast(
     "Restore সফল হয়েছে"
    );

   }catch(e){

    toast(
     "Backup ফাইল সঠিক নয়"
    );

   }

  };


 reader.readAsText(file);

}

 D={

 };


 save();

 render();

}
